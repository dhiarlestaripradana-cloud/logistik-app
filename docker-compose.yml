# =============================================================
#  docker-compose.yml — Stack Produksi VPS
#  Layanan: app (Next.js) · db (PostgreSQL 16) · caddy (reverse proxy + HTTPS otomatis)
#  Timezone dipaksa ke Asia/Jakarta (WIB) di seluruh container.
# =============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: logistik_db
    init: true
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 256m
    command: >
      postgres
      -c shared_buffers=192MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
      -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistik_app
    restart: unless-stopped
    mem_limit: 1792m
    mem_reservation: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Jakarta
      # 👇 BERUBAH: Tambahan limit koneksi di ujung URL
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=5&pool_timeout=20
      # 👇 BERUBAH: Penambahan NODE_OPTIONS di sini
      NODE_OPTIONS: "--max-old-space-size=640"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${APP_URL}
      NODE_ENV: production
    volumes:
      # 👇 BERUBAH: Penyimpanan foto bukti di luar folder public
      - uploads:/app/data/uploads
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: logistik_caddy
    restart: unless-stopped
    # 👇 BERUBAH: Penambahan limit RAM untuk caddy di sini
    mem_limit: 128m
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Asia/Jakarta
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge